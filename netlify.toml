[build]
  command = "npm run build"
  publish = "dist"

# Production: uppdatera databasschemat (db/schema.sql) innan bygget, så att databasen aldrig ligger
# efter koden. Görs bara när filen har ändrats. Schemat är bakåtkompatibelt och kan köras om, så en
# deploy som sedan misslyckas lämnar den gamla sajten fungerande. DATABASE_URL måste vara tillgänglig
# för Builds i Netlify. Nödbroms: sätt SKIP_DB_SETUP=1 i Netlify. Deploy previews och lokala
# `netlify build` migrerar inte (ej mergad kod rör inte production-databasen).
[context.production]
  command = "npm run db:setup -- --schema-only --deploy && npm run build"

[build.environment]
  NODE_VERSION = "22"

[functions]
  node_bundler = "esbuild"

# Lokal utveckling med API: `npm run dev:full` (netlify dev) startar Vite + funktionerna
[dev]
  command = "npm run dev"
  targetPort = 5173
  framework = "#custom"

# SPA-fallback: låt TanStack Router hantera alla sökvägar (t.ex. /auktion/volvo-v70-2014).
# /api/* fångas av funktionen netlify/functions/api.mts innan denna regel.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
